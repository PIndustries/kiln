name: Server validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS arm64 / Swift 6.2.3
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install documented Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://download.swift.org/swift-6.2.3-release/xcode/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE-osx.pkg' \
            --output "$RUNNER_TEMP/swift-6.2.3.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/swift-6.2.3.pkg"
          sudo installer -pkg "$RUNNER_TEMP/swift-6.2.3.pkg" -target /
          test -x /Library/Developer/Toolchains/swift-6.2.3-RELEASE.xctoolchain/usr/bin/swift
          echo /Library/Developer/Toolchains/swift-6.2.3-RELEASE.xctoolchain/usr/bin >> "$GITHUB_PATH"
          echo 'TOOLCHAINS=swift 6.2.3' >> "$GITHUB_ENV"
      - name: Verify toolchain and record validation revision
        shell: bash
        run: |
          set -euo pipefail
          swift --version | tee "$RUNNER_TEMP/swift-version.txt"
          grep -Eq 'Swift version 6\.2\.3([[:space:]]|$)' "$RUNNER_TEMP/swift-version.txt"
          test "$(uname -m)" = arm64
          python3 --version
          ssh -V
          {
            echo '### macOS server validation'
            echo "Source revision: $(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "Host: $(sw_vers -productVersion) / $(uname -m)"
            cat "$RUNNER_TEMP/swift-version.txt"
            echo 'Deterministic local fixtures only; no live AI provider credentials.'
            echo 'Hard cgroup enforcement is covered separately by linux-resources.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Unit and policy tests with locked dependencies
        run: swift test --jobs 2 --force-resolved-versions
      - name: SSH, HTTP, WebSocket, crash recovery and restore
        run: python3 scripts/integration.py
      - name: Repeated recovery soak and interrupted deployment recovery
        run: KILN_SOAK_CYCLES=5 python3 scripts/crash-recovery-integration.py
      - name: SSH admission, handshake deadlines and identity recovery
        run: python3 scripts/transport-integration.py
      - name: Named identities and permission boundaries
        run: python3 scripts/identity-integration.py
      - name: Vault hidden input, credential rotation and scoped delivery
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/kiln-terminal-tests"
          "$RUNNER_TEMP/kiln-terminal-tests/bin/python" -m pip install --require-hashes --only-binary=:all: -r scripts/terminal-test-requirements.txt
          "$RUNNER_TEMP/kiln-terminal-tests/bin/python" scripts/vault-integration.py
      - name: Explicit node adoption and durable peer operations
        run: python3 scripts/cluster-integration.py
      - name: Managed deployment and rollback
        run: python3 scripts/deployment-integration.py
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2.3
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install test clients
        run: apt-get update && apt-get install -y --no-install-recommends openssh-client python3 python3-venv
      - name: Record Linux validation revision and toolchain
        shell: bash
        run: |
          set -euo pipefail
          swift --version | tee "$RUNNER_TEMP/swift-version.txt"
          grep -Eq 'Swift version 6\.2\.3([[:space:]]|$)' "$RUNNER_TEMP/swift-version.txt"
          {
            echo '### Linux container server validation'
            echo "Source revision: $(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "Architecture: $(uname -m)"
            cat "$RUNNER_TEMP/swift-version.txt"
            echo 'Container checks do not establish kernel cgroup enforcement; see linux-resources.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Unit and policy tests
        run: swift test --jobs 2 --force-resolved-versions
      - name: SSH, HTTP, WebSocket, crash recovery and restore
        run: python3 scripts/integration.py
      - name: Repeated recovery soak and interrupted deployment recovery
        run: KILN_SOAK_CYCLES=5 python3 scripts/crash-recovery-integration.py
      - name: SSH admission, handshake deadlines and identity recovery
        run: python3 scripts/transport-integration.py
      - name: Named identities and permission boundaries
        run: python3 scripts/identity-integration.py
      - name: Vault hidden input, credential rotation and scoped delivery
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/kiln-terminal-tests"
          "$RUNNER_TEMP/kiln-terminal-tests/bin/python" -m pip install --require-hashes --only-binary=:all: -r scripts/terminal-test-requirements.txt
          "$RUNNER_TEMP/kiln-terminal-tests/bin/python" scripts/vault-integration.py
      - name: Explicit node adoption and durable peer operations
        run: KILN_TEST_MULTICAST=1 python3 scripts/cluster-integration.py
      - name: Managed deployment and rollback
        run: python3 scripts/deployment-integration.py
  linux-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build native Linux runtime
        run: |
          sudo mkdir -p /opt/kiln-test/bin /opt/kiln-test/lib
          docker run --rm --cpus=2 --memory=6g --pids-limit=512 \
            -v "$PWD:/workspace" -v /opt/kiln-test/lib:/runtime -w /workspace swift:6.2.3 \
            bash -c 'swift --version && swift build --jobs 2 --force-resolved-versions && cp -a /usr/lib/swift/linux/*.so* /runtime/'
          sudo install -m 0755 .build/debug/kiln /opt/kiln-test/bin/kiln
      - name: Record kernel validation revision and toolchain
        run: |
          {
            echo '### Native Linux systemd/cgroup validation'
            echo "Source revision: $(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "Host architecture: $(uname -m)"
            docker run --rm swift:6.2.3 swift --version
            echo 'The Docker-built executable is tested on the hosted VM, outside the container.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4t64 libxml2 libedit2 libatomic1 libicu74 libsqlite3-0 libzstd1 libstdc++6 libncurses6 openssh-client python3
          echo /opt/kiln-test/lib | sudo tee /etc/ld.so.conf.d/kiln-test.conf
          sudo ldconfig
      - name: Kernel-enforced budgets and descendant recovery
        run: sudo env KILN_BIN_DIR=/opt/kiln-test/bin python3 scripts/resource-integration.py
