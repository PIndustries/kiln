name: Package validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/packages.yml'
      - 'scripts/package-release.py'
      - 'scripts/package-upgrade-integration.py'
      - 'Sources/KilnKit/Version.swift'
      - 'docs/packages.md'
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            container: null
            platform: macos-arm64
          - runner: ubuntu-24.04
            container: swift:6.2.3
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Swift 6.2.3 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://download.swift.org/swift-6.2.3-release/xcode/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE-osx.pkg \
            -o "$RUNNER_TEMP/swift.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/swift.pkg"
          sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
          echo /Library/Developer/Toolchains/swift-6.2.3-RELEASE.xctoolchain/usr/bin >> "$GITHUB_PATH"
      - name: Install Linux test clients
        if: runner.os == 'Linux'
        run: |
          apt-get update && apt-get install -y --no-install-recommends openssh-client python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build candidate package
        run: python3 scripts/package-release.py --output "$RUNNER_TEMP/packages"
      - name: Extract and test packaged executables with disposable state
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/installed"
          tar -xzf "$RUNNER_TEMP/packages/kiln-"*.tar.gz -C "$RUNNER_TEMP/installed"
          KILN_BIN_DIR="$(find "$RUNNER_TEMP/installed" -type d -name bin)"
          export KILN_BIN_DIR
          "$KILN_BIN_DIR/kiln" --version
          python3 scripts/integration.py
      - name: Rehearse packaged runtime upgrade and compatible rollback
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(find "$RUNNER_TEMP/installed" -type d -name bin)"
          python3 scripts/package-upgrade-integration.py --candidate "$(dirname "$candidate")" \
            </dev/null | tee "$RUNNER_TEMP/package-upgrade.log"
          grep -Fx KILN_PACKAGE_UPGRADE_ROLLBACK_COMPLETE "$RUNNER_TEMP/package-upgrade.log"
          {
            echo '### Packaged runtime upgrade and rollback passed'
            echo 'Pinned public 26.10.09.1 package → candidate → original package.'
            echo 'Persistent disposable state, SSH host identity, Vault grants/key, REST/WebSocket, stopped intent and cold backups verified.'
            echo 'Neither package executable was overwritten; no user node or published release was changed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned secret scanner
        run: |
          python3 scripts/install-gitleaks.py --directory "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan final archive bytes before upload
        run: python3 scripts/secret-scan.py --artifacts "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/package-secret-reports"
      - name: Upload validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: kiln-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 14
  clean-macos:
    name: Clean install / macOS arm64
    needs: package
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kiln-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Verify and run downloaded package on a fresh runner
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Intentionally no Swift installer or build step in this job.
          test "$(uname -m)" = arm64
          cd "$RUNNER_TEMP/candidate"
          shasum -a 256 -c ./*.sha256
          mkdir "$RUNNER_TEMP/clean-installed"
          tar -xzf ./kiln-*.tar.gz -C "$RUNNER_TEMP/clean-installed"
          KILN_BIN_DIR="$(find "$RUNNER_TEMP/clean-installed" -type d -name bin)"
          export KILN_BIN_DIR
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          package = pathlib.Path(os.environ['KILN_BIN_DIR']).parent
          info = json.loads((package / 'build-info.json').read_text())
          assert info['sourceRevision'] == os.environ['EXPECTED_REVISION']
          assert info['platform'] == 'macos-arm64'
          for entry in info['files']:
              assert hashlib.sha256((package / entry['path']).read_bytes()).hexdigest() == entry['sha256'], entry['path']
          print('PASS downloaded package revision and all manifest file digests')
          PY
          "$KILN_BIN_DIR/kiln" --version
          python3 "$GITHUB_WORKSPACE/scripts/integration.py"
          {
            echo '### Fresh macOS package installation passed'
            echo "Source revision: $EXPECTED_REVISION"
            echo "Host: $(sw_vers -productVersion) / $(uname -m)"
            echo 'Downloaded archive: checksum, manifest digests and real SSH/REST/WebSocket integration passed.'
            echo 'No additional Swift toolchain installed; hosted macOS includes its standard Xcode installation.'
          } >> "$GITHUB_STEP_SUMMARY"
  clean-linux:
    name: Clean install / Linux bundled runtime
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kiln-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Install and exercise package without a Swift compiler
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm -i --cpus=2 --memory=4g --pids-limit=512 \
            -e EXPECTED_REVISION \
            -v "$RUNNER_TEMP/candidate:/candidate:ro" \
            -v "$GITHUB_WORKSPACE/scripts/integration.py:/test/integration.py:ro" \
            ubuntu:24.04 bash -s <<'SH' | tee "$RUNNER_TEMP/clean-linux.log"
          set -euo pipefail
          apt-get update -qq </dev/null
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libcurl4t64 libxml2 libedit2 libatomic1 libicu74 libsqlite3-0 libzstd1 libstdc++6 libncurses6 openssh-client python3 ca-certificates </dev/null
          if command -v swift || command -v swiftc; then
            echo 'Unexpected Swift compiler on runtime-only host' >&2
            exit 1
          fi
          echo 'PASS no Swift compiler on runtime-only host'
          cd /candidate
          sha256sum -c ./*.sha256
          mkdir /installed
          tar -xzf ./kiln-*.tar.gz -C /installed
          KILN_BIN_DIR="$(find /installed -type d -name bin)"
          export KILN_BIN_DIR
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          package = pathlib.Path(os.environ['KILN_BIN_DIR']).parent
          info = json.loads((package / 'build-info.json').read_text())
          assert info['sourceRevision'] == os.environ['EXPECTED_REVISION']
          assert info['platform'] == 'linux-x86_64'
          for entry in info['files']:
              assert hashlib.sha256((package / entry['path']).read_bytes()).hexdigest() == entry['sha256'], entry['path']
          print('PASS downloaded package revision and all manifest file digests')
          PY
          "$KILN_BIN_DIR/kiln" --version
          python3 /test/integration.py </dev/null
          echo KILN_CLEAN_INSTALL_COMPLETE
          SH
          # A package-maintainer program must not consume the bash -s script and
          # turn a skipped test into exit 0. Require proof from inside the container.
          grep -Fx 'KILN_CLEAN_INSTALL_COMPLETE' "$RUNNER_TEMP/clean-linux.log"
          grep -Fx 'PASS downloaded package revision and all manifest file digests' "$RUNNER_TEMP/clean-linux.log"
          grep -Fx 'PASS: runtime and modules work with SSH disabled' "$RUNNER_TEMP/clean-linux.log"
          {
            echo '### Fresh Linux runtime-only package installation passed'
            echo "Source revision: $EXPECTED_REVISION"
            echo 'Ubuntu 24.04 container; OS libraries only, Swift runtime comes exclusively from the archive.'
            echo 'swift and swiftc absent from PATH; no checkout/build tree mounted.'
            echo 'Downloaded archive: checksum, manifest digests and real SSH/REST/WebSocket integration passed.'
          } >> "$GITHUB_STEP_SUMMARY"
