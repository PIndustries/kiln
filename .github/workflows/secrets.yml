name: Secret scanning
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag whose assets must also be scanned
        required: false
        type: string
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        run: |
          python3 scripts/install-gitleaks.py --directory "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Verify detection and redaction
        run: python3 scripts/secret-scan-test.py
      - name: Scan reachable history and tracked examples, fixtures and source
        run: python3 scripts/secret-scan.py --history --tree --output "$RUNNER_TEMP/secret-reports"
      - name: Download published assets without executing or extracting them
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets"
      - name: Scan published asset contents
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: python3 scripts/secret-scan.py --artifacts "$RUNNER_TEMP/release-assets" --output "$RUNNER_TEMP/secret-reports"
      - name: Preserve only sanitized finding metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-scan-metadata
          path: ${{ runner.temp }}/secret-reports/*.json
          if-no-files-found: ignore
          retention-days: 1
